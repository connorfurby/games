name: CI

on:
  push:
    branches: [main, '2.0', '2.0/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit, balance and pacing tests
        run: npm test
