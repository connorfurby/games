<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games — Grocery Empire</title>
    <meta name="theme-color" content="#11161a" />
    <style>
      /* Boot screen: painted before any JS so the first frame is never white. React replaces #root. */
      html, body { margin: 0; background: #11161a; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #efe6cf;
        font: 600 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
      .boot__in { display: grid; justify-items: center; gap: 14px; animation: boot-in .4s ease-out both .15s; }
      .boot__awning { display: flex; width: 120px; height: 18px; border-radius: 4px 4px 0 0; overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,.4); }
      .boot__awning i { flex: 1; background: #e8583c; }
      .boot__awning i:nth-child(even) { background: #efe6cf; }
      .boot__shop { width: 108px; height: 54px; margin-top: -14px; background: #3a2f2a; border-radius: 0 0 6px 6px;
        display: grid; place-items: center; }
      .boot__shop b { width: 34px; height: 20px; background: #f2c14e; border-radius: 2px; animation: boot-glow 1.2s ease-in-out infinite alternate; }
      .boot__bar { width: 140px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
      .boot__bar i { display: block; width: 40%; height: 100%; border-radius: 99px;
        background: linear-gradient(90deg, #e8583c, #f2c14e); animation: boot-slide 1.1s ease-in-out infinite; }
      .boot__t { letter-spacing: .12em; text-transform: uppercase; font-size: 11px; color: #f2c14e; }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes boot-glow { from { opacity: .55; } to { opacity: 1; } }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .boot * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot__in">
          <div class="boot__awning"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="boot__shop"><b></b></div>
          <span class="boot__t">Opening up</span>
          <span class="boot__bar"><i></i></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
